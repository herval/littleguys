# Push a tag like v0.1.1 (matching the version in src-tauri/tauri.conf.json) and
# this builds the universal app, signs it with the Developer ID certificate,
# notarizes it, and publishes the .dmg plus the signed update bundle and
# latest.json (what the in-app updater reads). It then bumps the cask in
# herval/homebrew-tap.
#
# Secrets (`make release-secrets` sets them all):
#   APPLE_CERTIFICATE           Developer ID Application cert + key, exported as .p12, base64
#   APPLE_CERTIFICATE_PASSWORD  the .p12's password
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Herval Freire (TEAMID)"
#   APPLE_ID                    Apple Account email, for notarization
#   APPLE_PASSWORD              an app-specific password for it (account.apple.com)
#   APPLE_TEAM_ID               the 10-character team ID
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/littleguys-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  contents of ~/.tauri/littleguys-updater.key.password
#   HOMEBREW_TAP_DEPLOY_KEY     private half of a write deploy key on herval/homebrew-tap

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi

      # Checked up front, so a missing or wrong credential fails here and not after the build.
      - name: Signing and notarization credentials work
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD \
            APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD HOMEBREW_TAP_DEPLOY_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. Run make release-secrets."
            exit 1
          fi

          kc="$RUNNER_TEMP/check.keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p check "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" ||
            { echo "::error::APPLE_CERTIFICATE doesn't open with APPLE_CERTIFICATE_PASSWORD"; exit 1; }
          if ! security find-identity -p codesigning "$kc" | grep -qF "\"$APPLE_SIGNING_IDENTITY\""; then
            security find-identity -p codesigning "$kc"
            echo "::error::APPLE_CERTIFICATE has no \"$APPLE_SIGNING_IDENTITY\" identity"
            exit 1
          fi
          security delete-keychain "$kc"
          rm "$RUNNER_TEMP/cert.p12"

          xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" >/dev/null ||
            { echo "::error::Apple didn't accept APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID for notarization"; exit 1; }

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Builds into a draft so a failed build or notarization never leaves a
      # half-empty release where the updater can see it.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: littleguys ${{ github.ref_name }}
          releaseBody: "Install with `brew install herval/tap/littleguys`, or download the .dmg below. Already running littleguys? It updates itself."
          releaseDraft: true
          args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json

      - name: Gatekeeper accepts the app
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/littleguys.app
          lipo -archs "$app/Contents/MacOS/littleguys"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  homebrew:
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: herval/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Fill in the cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="littleguys_${version}_universal.dmg"
          gh release download "$GITHUB_REF_NAME" --pattern "$dmg" --dir "$RUNNER_TEMP"
          sha=$(sha256sum "$RUNNER_TEMP/$dmg" | cut -d' ' -f1)
          sed -E \
            -e "s/^  version \".*\"/  version \"${version}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${sha}\"/" \
            -e '/^# /d' \
            packaging/homebrew/littleguys.rb > "$RUNNER_TEMP/littleguys.rb"
          cat "$RUNNER_TEMP/littleguys.rb"

      - name: Push it to herval/homebrew-tap
        working-directory: tap
        run: |
          mkdir -p Casks
          cp "$RUNNER_TEMP/littleguys.rb" Casks/littleguys.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/littleguys.rb
          git diff --cached --quiet && { echo "Cask already up to date"; exit 0; }
          git commit -m "littleguys ${GITHUB_REF_NAME#v}"
          git push
