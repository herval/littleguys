# On every push to main (and pull request): the Rust tests on Windows, and an
# unsigned installer to try, under the run's Artifacts. Releases build their
# own installer in release.yml.
name: Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Installer
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: littleguys-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
